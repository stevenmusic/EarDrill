<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0C0A07">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="聽音特訓">
<meta name="application-name" content="EarDrill">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="description" content="EarDrill 聽音特訓:單音、音程、和弦聽音練習與 ABRSM / Trinity 檢定聽力測驗,取樣鋼琴出題、自動批改。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='4' fill='%230C0A07'/%3E%3Cg fill='none' stroke='%23F2B94B' stroke-width='2' stroke-linecap='round' stroke-linejoin='round' transform='translate(1.8 1.8) scale(0.85)'%3E%3Cpath d='M6 8.5a6.5 6.5 0 1 1 13 0c0 6-6 6-6 10a3.5 3.5 0 1 1-7 0'/%3E%3Cpath d='M15 8.5a2.5 2.5 0 0 0-5 0v1a2 2 0 1 1 0 4'/%3E%3C/g%3E%3C/svg%3E">
<title>EarDrill 聽音特訓</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css?v=01f6352a76">
</head>
<body>
<header>
  <div class="header-left">
    <h1>Ear<span>Drill</span></h1>
    <span class="tagline">聽音特訓</span>
  </div>
  <div class="header-right">
    <button class="btn small ghost" id="examChip" hidden></button>
    <button class="btn" id="themeToggle" aria-pressed="false" data-i18n-attr="aria-label:themeToggleLabel,title:themeToggleTitle" aria-label="淺色模式" title="切換淺色/深色主題">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 000 18z" fill="currentColor" stroke="none"/></svg>
    </button>
    <button class="btn" id="langToggle" aria-pressed="false" data-i18n-attr="aria-label:langToggleLabel,title:langToggleTitle" data-i18n="langToggleText">EN</button>
  </div>
</header>

<main>
  <!-- 單音 / 音程 / 和弦:設定(由 js/app.js 產生) -->
  <section class="card picker pane" data-pane="note" id="paneNote">
    <button class="setup-summary" aria-expanded="false"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg><span class="sum"></span><svg class="chev" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></button>
    <div class="setup-body"><div class="rows"></div></div>
  </section>
  <section class="card picker pane" data-pane="interval" id="paneInterval" hidden>
    <button class="setup-summary" aria-expanded="false"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg><span class="sum"></span><svg class="chev" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></button>
    <div class="setup-body"><div class="rows"></div></div>
  </section>
  <section class="card picker pane" data-pane="chord" id="paneChord" hidden>
    <button class="setup-summary" aria-expanded="false"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg><span class="sum"></span><svg class="chev" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></button>
    <div class="setup-body"><div class="rows"></div></div>
  </section>

  <!-- 檢定:考試系統、級數 -->
  <section class="card setup pane" data-pane="exam" id="paneExam" hidden>
    <button class="setup-summary" aria-expanded="false"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg><span class="sum" id="examSummary"></span><svg class="chev" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></button>
    <div class="setup-body">
      <div class="fields">
        <div class="field"><span class="lbl" data-i18n="lblSystem">考試系統</span>
          <div class="seg" id="systemSeg" role="group" aria-label="考試系統">
            <button data-v="abrsm" aria-pressed="true">ABRSM</button>
            <button data-v="trinity" aria-pressed="false">Trinity</button>
          </div></div>
        <div class="field"><label for="selGrade" data-i18n="lblGrade">級數</label><select id="selGrade"></select></div>
      </div>
      <p class="verify-note" id="examNote"></p>
    </div>
  </section>

  <!-- 題目卡(四個分頁共用) -->
  <section class="card quiz" id="quizCard" aria-live="polite">
    <div class="quiz-top" id="quizTop" hidden>
      <div class="q-actions">
        <button class="btn primary" id="drawBtn" hidden>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8" cy="8" r="1.3" fill="currentColor"/><circle cx="16" cy="16" r="1.3" fill="currentColor"/><circle cx="12" cy="12" r="1.3" fill="currentColor"/></svg>
          <span class="btn-label" data-i18n="draw">隨機抽一題</span></button>
      </div>
    </div>
    <div class="q-head">
      <div class="q-title empty" id="qTitle"></div>
      <button class="play-round" id="playBtn" disabled>
        <svg class="play-ring" id="playRing" viewBox="0 0 64 64" aria-hidden="true"><circle class="ring-bg" cx="32" cy="32" r="30" pathLength="1"/><circle class="ring-fg" cx="32" cy="32" r="30" pathLength="1"/></svg>
        <svg id="playIcon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4v16l13-8z"/></svg>
        <span class="sr" id="playLabel">播放題目</span></button>
    </div>
    <!-- 標籤 | 載入進度 | 本輪分數(放同一列,題目上方不再空一大塊) -->
    <div class="q-row"><div class="q-tags" id="qTags"></div><span class="loading" id="loadingMsg"></span><span class="count" id="scoreLine"></span></div>
    <p class="step-q" id="stepQ"></p>
    <div class="answers" id="answers"></div>
    <div class="feedback" id="feedback"></div>
    <div class="q-foot">
      <button class="btn ghost small" id="revealBtn" data-i18n="showAnswer">顯示答案</button>
      <span style="flex:1"></span>
      <button class="btn primary" id="nextBtn" disabled>
        <span class="btn-label" data-i18n="next">下一題</span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg></button>
    </div>
    <div class="play-opts" id="practiceOpts">
      <button class="chip" id="optAuto" aria-pressed="false" data-i18n="optAuto">答對自動下一題</button>
      <button class="chip" id="optAdaptive" aria-pressed="false" data-i18n="optAdaptive">加強弱項</button>
    </div>
  </section>

  <!-- 檢定:本級聽力測驗(每一項的要求 + 可以練的題型) -->
  <details class="card pane" data-pane="exam" id="testsCard" open hidden>
    <summary class="card-title"><b data-i18n="examTestsTitle">本級聽力測驗</b><span class="sub" id="testsSub"></span>
      <svg class="chev" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></summary>
    <div id="testsList"></div>
  </details>

  <!-- 各項正確率 -->
  <section class="card" id="statsCard">
    <div class="card-title"><b data-i18n="statsTitle">各項正確率</b><span class="sub"></span>
      <button class="btn ghost small" id="statsReset" data-i18n="statsReset">重設</button></div>
    <div class="stats" id="statsList"></div>
  </section>

  <!-- 練習紀錄 -->
  <section class="card" id="logCard">
    <div class="card-title"><b data-i18n="logTitle">練習紀錄</b></div>
    <div class="log-stats">
      <div><b id="logStreak">0</b><small data-i18n="logStreak">連續天數</small></div>
      <div><b id="logToday">0</b><small data-i18n="logToday">今天題數</small></div>
      <div><b id="logAcc">–</b><small data-i18n="logAcc">今天正確率</small></div>
    </div>
    <div class="log-week" id="logWeek"></div>
  </section>

  <footer data-i18n="footer" data-i18n-pair></footer>
</main>

<!-- 底部分頁 -->
<nav class="tabbar" id="tabbar" role="tablist" aria-label="練習項目">
  <button role="tab" data-tab="note" aria-selected="true">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="18" r="3"/><path d="M11 18V4l7 3"/></svg><span data-i18n="tabNote">單音</span></button>
  <button role="tab" data-tab="interval" aria-selected="false">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="17" r="2.5"/><circle cx="17" cy="8" r="2.5"/><path d="M8.5 17H12V8h2.5"/></svg><span data-i18n="tabInterval">音程</span></button>
  <button role="tab" data-tab="chord" aria-selected="false">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="19" r="2.5"/><circle cx="9" cy="12" r="2.5"/><circle cx="9" cy="5" r="2.5"/><path d="M11.5 19V5M16 5h4M16 12h4M16 19h4"/></svg><span data-i18n="tabChord">和弦</span></button>
  <button role="tab" data-tab="exam" aria-selected="false">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4h6l1 2h3v15H5V6h3z"/><path d="m9 13 2 2 4-4"/></svg><span data-i18n="tabExam">檢定</span></button>
</nav>

<!-- 第一次打開:在準備考試嗎? -->
<div class="modal" id="onboard" hidden role="dialog" aria-modal="true" aria-labelledby="onboardTitle">
  <div class="modal-card">
    <h2 id="onboardTitle" data-i18n="obTitle">你在準備聽力檢定嗎?</h2>
    <p class="modal-sub" data-i18n="obSub" data-i18n-pair></p>
    <div class="field"><span class="lbl" data-i18n="lblSystem">考試系統</span>
      <div class="seg" id="obSystem" role="group">
        <button data-v="abrsm" aria-pressed="true">ABRSM</button>
        <button data-v="trinity" aria-pressed="false">Trinity</button>
      </div></div>
    <div class="field"><label for="obGrade" data-i18n="lblGrade">級數</label><select id="obGrade"></select></div>
    <div class="modal-actions">
      <button class="btn primary" id="obYes" data-i18n="obYes">開始準備考試</button>
      <button class="btn ghost" id="obNo" data-i18n="obNo">不考試,自由練習</button>
    </div>
  </div>
</div>

<script type="importmap">{"imports":{"./js/app.js":"./js/app.js?v=7ceb82d44d","./js/audio.js":"./js/audio.js?v=10487b3960","./js/aural.js":"./js/aural.js?v=6be4cf7ff3","./js/ear.js":"./js/ear.js?v=7941fce2d5","./js/i18n.js":"./js/i18n.js?v=8713689717","./js/music.js":"./js/music.js?v=11655ff5cd","./js/store.js":"./js/store.js?v=d786f2de0f"}}</script>
<script type="application/json" id="edVersions">{"data/aural.json":"c2589a3fb5"}</script>
<script type="module" src="js/app.js?v=7ceb82d44d"></script>
</body>
</html>
